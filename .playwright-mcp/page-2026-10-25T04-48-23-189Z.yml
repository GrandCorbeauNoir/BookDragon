        - link [ref=e252] [cursor=pointer]:
          - /url: /books/RXARim9cNBIC
          - generic [ref=e253]:
            - heading "Computer Organization and Design, Revised Printing" [level=3] [ref=e254]
            - paragraph [ref=e255]: David A. Patterson, John L. Hennessy
            - paragraph [ref=e256]: "What's New in the Third Edition, Revised Printing The same great book gets better! This revised printing features all of the original content along with these additional features:• Appendix A (Assemblers, Linkers, and the SPIM Simulator) has been moved from the CD-ROM into the printed book• Corrections and bug fixesThird Edition featuresNew pedagogical features•Understanding Program Performance -Analyzes key performance issues from the programmer's perspective •Check Yourself Questions -Helps students assess their understanding of key points of a section •Computers In the Real World -Illustrates the diversity of applications of computing technology beyond traditional desktop and servers •For More Practice -Provides students with additional problems they can tackle •In More Depth -Presents new information and challenging exercises for the advanced student New reference features •Highlighted glossary terms and definitions appear on the book page, as bold-faced entries in the index, and as a separate and searchable reference on the CD. •A complete index of the material in the book and on the CD appears in the printed index and the CD includes a fully searchable version of the same index. •Historical Perspectives and Further Readings have been updated and expanded to include the history of software R&D. •CD-Library provides materials collected from the web which directly support the text. In addition to thoroughly updating every aspect of the text to reflect the most current computing technology, the third edition •Uses standard 32-bit MIPS 32 as the primary teaching ISA. •Presents the assembler-to-HLL translations in both C and Java. •Highlights the latest developments in architecture in Real Stuff sections: -Intel IA-32 -Power PC 604 -Google's PC cluster -Pentium P4 -SPEC CPU2000 benchmark suite for processors -SPEC Web99 benchmark for web servers -EEMBC benchmark for embedded systems -AMD Opteron memory hierarchy -AMD vs. 1A-64 New support for distinct course goals Many of the adopters who have used our book throughout its two editions are refining their courses with a greater hardware or software focus. We have provided new material to support these course goals: New material to support a Hardware Focus •Using logic design conventions •Designing with hardware description languages •Advanced pipelining •Designing with FPGAs •HDL simulators and tutorials •Xilinx CAD tools New material to support a Software Focus •How compilers work •How to optimize compilers •How to implement object oriented languages •MIPS simulator and tutorial •History sections on programming languages, compilers, operating systems and databases On the CD•NEW: Search function to search for content on both the CD-ROM and the printed text•CD-Bars: Full length sections that are introduced in the book and presented on the CD •CD-Appendixes: Appendices B-D •CD-Library: Materials collected from the web which directly support the text •CD-Exercises: For More Practice provides exercises and solutions for self-study•In More Depth presents new information and challenging exercises for the advanced or curious student •Glossary: Terms that are defined in the text are collected in this searchable reference •Further Reading: References are organized by the chapter they support •Software: HDL simulators, MIPS simulators, and FPGA design tools •Tutorials: SPIM, Verilog, and VHDL •Additional Support: Processor Models, Labs, Homeworks, Index covering the book and CD contents Instructor Support Instructor support provided on textbooks.elsevier.com:•Solutions to all the exercises •Figures from the book in a number of formats •Lecture slides prepared by the authors and other instructors •Lecture notes"
      - listitem [ref=e257]:
        - link [ref=e258] [cursor=pointer]:
          - /url: /books/uUcr0gEACAAJ
          - generic [ref=e259]:
            - heading "Teaching My Dad How Computers Work" [level=3] [ref=e260]
            - paragraph [ref=e261]: Giovanni Campardo, Roberto Gastaldi
            - paragraph [ref=e262]: How many times a day do we rely on an electronic device, often without even noticing it? From smart washing machines and connected refrigerators to phones, cars with assisted driving, and medical diagnostic systems, the modern world is powered by astonishingly complex electronic machines. Yet at their core, all these systems, whether guiding a spacecraft or preparing a perfect cup of coffee, are built from the same fundamental components. This book offers a clear, accessible journey into the inner workings of computers and electronic systems. It explains how billions of interconnected transistors, each behaving like a simple switch, combine to perform logical operations using only 1s and 0s. Step by step, it reveals how these basic building blocks enable machines to make decisions, execute programs, and carry out the sophisticated tasks we depend on every day. Written with the curiosity of a daughter determined to explain modern technology to her father, born in the last century, this book demystifies the architecture of hardware and the structure of software without assuming prior technical knowledge. Through intuitive examples and engaging storytelling, it shows that behind the apparent magic of digital technology lies an elegant and comprehensible logic. Perfect for curious readers, Teaching My Dad How Computers Work is an invitation to understand the digital world and to discover how simple ideas, multiplied billions of times, shape the intelligent machines around us.
