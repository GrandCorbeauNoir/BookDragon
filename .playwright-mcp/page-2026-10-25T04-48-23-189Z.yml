      - listitem [ref=e236]:
        - link [ref=e237] [cursor=pointer]:
          - /url: /books/56TT-cJeP9wC
          - generic [ref=e238]:
            - heading "PC Systems, Installation and Maintenance" [level=3] [ref=e239]
            - paragraph [ref=e240]: R. P. Beales
            - paragraph [ref=e241]: Written in a straightforward, easy to read style, Rob Beales provides the knowledge and techniques needed to build, troubleshoot, and maintain personal computer systems. Divided into three parts, Part 1 forms an introduction to digital computers, leading the reader through the various parts of a modern PC system, including popular peripherals and networking concepts. Part 2 contains a step-by-step guide on the assembly and configuration of a complete state-of-the-art PC system, including a section on the use of important Windows 98 / ME / 2000 / XP applications and components. Part 3 covers preventative, predictive and corrective maintenance, based in typical current work practice – a major part of the IT practitioner’s work schedule. Case Studies and practical worked examples are included throughout the text, with additional Case Studies, specifically aimed to meet the requirements of e-Quals courses on an accompanying website. Further web resources include key figures from the text available to download in full-colour, with a wealth of extra material covering Binary / Hex and basic logic functions; ASCII tables; Connector types and pinouts; Bus slots; RAM slots and further useful website links. Updated throughout in line with current technologies, the second edition is also designed to cover the latest specifications of BTEC National and City and Guilds e-Quals (400 and 500) courses, and the A+ certification, in addition to meeting the needs of the general PC user.
