      - listitem [ref=e281]:
        - link [ref=e282] [cursor=pointer]:
          - /url: /books/wuweBgAAQBAJ
          - generic [ref=e283]:
            - heading "Annotated Bibliography of Films in Automation, Data Processing, and Computer Science" [level=3] [ref=e284]
            - paragraph [ref=e285]: Martin B. SolomanJr., Nora Geraldine Lovan
            - paragraph [ref=e286]: With the rapid development of computer science and the expanding use of computers in all facets of American life, there has been made available a wide range of instructional and informational films on automation, data processing, and computer science. Here is the first annotated bibliography of these and related films, gathered from industrial, institutional, and other sources. This bibliography annotates 244 films, alphabetically arranged by title, with a detailed subject index. Information is also provided concerning the intended audience, rental-purchase data, ordering procedures, and such specifications as running time and film size.
      - listitem [ref=e287]:
        - link [ref=e288] [cursor=pointer]:
          - /url: /books/MQ2rCAAAQBAJ
          - generic [ref=e289]:
            - heading "Visual Computing" [level=3] [ref=e290]
            - paragraph [ref=e291]: Tosiyasu L. Kunii
            - paragraph [ref=e292]: This volume presents the proceedings of the 10th International Conference of the Computer Graphics Society, CG International '92, Visual Computing - Integrating Computer Graphics with Computer Vision -, held at Kogakuin University, Tokyo in Japan from June 22-26,1992. Since its foundation in 1983, this conference has continued to attract high quality research articles in all aspects of computer graphics and its applications. Previous conferences in this series were held in Japan (1983-1987), in Switzerland (1988), in the United Kingdom (1989), in Singapore (1990), and in the United States of America (1991). Future CG International conferences are planned in Switzerland (1993), in Australia (1994), and in the United Kingdom (1995). It has been the editor's dream to research the integration of computer graphics with computer vision through data structures. The conference the editor put together in Los Angeles in 1975 involving the UCLA and IEEE Computer Societies had to spell out these three areas explicitly in the conference title, "computer graphics," "pattern recognition" and "data structures," as well as in the title of the proceedings published by IEEE Computer Society Press. In 1985, the editor gave the name "visual computer" to machines having all the three functionalities as seen in the journal under that name from Springer. Finally, the research in integrating visual information processing has now reached reality as seen in this proceedings of CG International '92. Chapters on virtual reality, and on tools and environments provide examples.
      - listitem [ref=e293]:
        - link [ref=e294] [cursor=pointer]:
          - /url: /books/zf1cQgAACAAJ
          - generic [ref=e295]:
            - heading "Fluency with Information Technology" [level=3] [ref=e296]
            - paragraph [ref=e297]: Lawrence Snyder
            - paragraph [ref=e298]: "Fluency with Information Technology: Skills, Concepts, and Capabilities, Fourth Edition,equips readers who are already familiar with computers, the Internet, and the World Wide Web with a deeper understanding of the broad capabilities of technology. Through a project-oriented learning approach that uses examples and realistic problem-solving scenarios, Larry Snyder teaches readers to navigate information technology independently and become effective users of today’s resources, forming a foundation of skills they can adapt to their personal and career goals as future technologies emerge."
