      - listitem [ref=e209]:
        - link [ref=e210] [cursor=pointer]:
          - /url: /books/24KW-5GBvgIC
          - generic [ref=e211]:
            - heading "Fumbling the Future" [level=3] [ref=e212]
            - paragraph [ref=e213]: Douglas K. Smith, Robert C. Alexander
            - paragraph [ref=e214]: Ask consumers and users what names they associate with the multibillion dollar personal computer market, and they will answer IBM, Apple, Tandy, or Lotus. The more knowledgable of them will add the likes of Microsoft, Ashton-Tate, Compaq, and Borland. But no one will say Xerox. Fifteen years after it invented personal computing, Xerox still means "copy." Fumbling the Future tells how one of America's leading corporations invented the technology for one of the fastest-growing products of recent times, then miscalculated and mishandled the opportunity to fully exploit it. It is a classic story of how innovation can fare within large corporate structures, the real-life odyssey of what can happen to an idea as it travels from inspiration to implementation. More than anything, Fumbling the Future is a tale of human beings whose talents, hopes, fears, habits, and prejudices determine the fate of our largest organizations and of our best ideas. In an era in which technological creativity and economic change are so critical to the competitiveness of the American economy, Fumbling the Future is a parable for our times.
      - listitem [ref=e215]:
        - link [ref=e216] [cursor=pointer]:
          - /url: /books/bjE5EHw35DkC
          - generic [ref=e217]:
            - heading "TEXTBOOK OF COMPUTER SCIENCE FOR CLASS XI" [level=3] [ref=e218]
            - paragraph [ref=e219]: SEEMA BHATNAGAR
            - paragraph [ref=e220]: This textbook, presented in a clear and friendly writing style, provides students of Class XI with a thorough introduction to the discipline of computer science. It offers accurate and balanced coverage of all the computer science topics as prescribed in the CBSE syllabus Code 083. Assuming no previous knowledge of computer science, this book discusses key computing concepts to provide invaluable insight into how computers work. It prepares students for the world of computing by giving them a solid foundation in programming concepts, operating systems, problem solving methodology, C++ programming language, data representation, and computer hardware. KEY FEATURES • Explains theory in user friendly and easy-to-approach style • Teaches C++ from scratch; knowledge of C is not needed • Provides Programming Examples • Gives Practical Exercise • Provides Answers to Short Questions • Gives Practice Questions at the end of each chapter • Suitable for Self-Study
